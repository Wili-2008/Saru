# Agregar este bloque a httpd-vhosts.conf. No reemplazar los otros proyectos.
<VirtualHost *:80>
    ServerName saru.com
    DocumentRoot "C:/Saru/frontend"

    <Directory "C:/Saru/">
        AllowOverride None
        Require all denied
    </Directory>

    <Directory "C:/Saru/frontend">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require local
        DirectoryIndex index.html
    </Directory>

    Alias "/api/" "C:/Saru/backend/api/"
    <Directory "C:/Saru/backend/api">
        Options -Indexes
        AllowOverride None
        Require local
        DirectoryIndex index.php
    </Directory>
</VirtualHost>
