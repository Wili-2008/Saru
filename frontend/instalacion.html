<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Instalación inicial · SARU</title><link rel="icon" href="assets/saru.svg" type="image/svg+xml"><link rel="stylesheet" href="css/saru.css"><script type="module" src="js/install.js"></script></head><body class="setup-body"><main class="setup-card"><a class="brand" href="index.html"><span class="brand-mark">S<span>↗</span></span><span>SARU<small>Instalación inicial</small></span></a><span class="section-tag">PRIMER ACCESO</span><h1>Prepara tu espacio.</h1><p class="muted">Crea la primera cuenta administrativa con la clave de instalación generada en este equipo.</p><div id="notice" role="status" aria-live="polite"></div><form id="install-form" class="form-stack" hidden><label>Clave de instalación<input name="token" type="password" required autocomplete="off" maxlength="100"></label><div class="form-grid"><label>Nombres<input name="nombres" required maxlength="100" autocomplete="given-name"></label><label>Apellidos<input name="apellidos" required maxlength="100" autocomplete="family-name"></label></div><label>Usuario<input name="usuario" required minlength="3" maxlength="60" pattern="[A-Za-z0-9._\-]{3,60}" autocomplete="username" autocapitalize="none" spellcheck="false"></label><label>Contraseña<input name="password" type="password" required minlength="12" maxlength="72" autocomplete="new-password" aria-describedby="password-help"></label><small id="password-help" class="muted">Usa una frase de al menos 12 caracteres (máximo 72 bytes).</small><label>Confirmar contraseña<input name="confirmar" type="password" required minlength="12" maxlength="72" autocomplete="new-password"></label><button class="button primary" type="submit">Crear administrador <span>↗</span></button></form><a class="back-link" href="index.html">← Volver al inicio de sesión</a></main></body></html>
